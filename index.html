<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>기사 합격노트</title>
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="합격노트">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f7;--card:#fff;--ink:#16181d;--ink2:#41464f;--mute:#8b909a;--line:#e9eaee;--soft:#f6f7f9;
  --pri:#3454d1;--pri2:#edf1ff;--ok:#16a06a;--okb:#e8f7f0;--no:#e5484d;--nob:#fdeced;--warn:#b7791f;--warnb:#fff6e5;--old:#6e56cf;--oldb:#f1eefe;
  --r:16px;--top:calc(env(safe-area-inset-top,0px))
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15.5px;line-height:1.6;letter-spacing:-.2px}
button,input,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0}
svg{display:block}
.top{position:sticky;top:0;z-index:10;background:rgba(244,245,247,.92);backdrop-filter:saturate(180%) blur(12px);-webkit-backdrop-filter:saturate(180%) blur(12px);padding:calc(var(--top) + 10px) 18px 10px;display:flex;align-items:center;gap:8px;min-height:56px}
.top .ttl{flex:1;font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ib{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--ink2)}
.top .ib:active{background:var(--line)}
.top .ib.on{color:#f0a020}
.pbar{position:absolute;left:0;right:0;bottom:0;height:3px;background:transparent}
.pbar i{display:block;height:100%;background:var(--pri);transition:width .25s}
main{max-width:720px;margin:0 auto;padding:4px 16px calc(96px + env(safe-area-inset-bottom))}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tabs button{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mute);padding:4px 0;position:relative}
.tabs button svg{width:23px;height:23px}
.tabs button.on{color:var(--pri);font-weight:700}
.tabs .dot{position:absolute;top:0;left:50%;margin-left:6px;background:var(--no);color:#fff;font-size:10px;line-height:16px;min-width:16px;padding:0 4px;border-radius:9px;font-weight:700}
/* 공통 */
.hero{padding:6px 2px 14px}
.hero h2{font-size:24px;line-height:1.35;margin:0 0 4px;font-weight:800;letter-spacing:-.6px}
.hero p{margin:0;color:var(--mute);font-size:14px}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:22px 4px 10px}
.sec h3{margin:0;font-size:16px;font-weight:700}
.sec .more{font-size:13px;color:var(--mute)}
.card{background:var(--card);border-radius:var(--r);padding:18px;margin-bottom:12px;border:1px solid var(--line)}
.card.tight{padding:6px 0}
.muted{color:var(--mute)}.small{font-size:13px}
.row{display:flex;align-items:center;gap:12px}.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:48px;padding:0 18px;border-radius:14px;background:var(--pri);color:#fff;font-weight:700;font-size:15px;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn.sub{background:var(--pri2);color:var(--pri)}
.btn.line{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn.red{background:var(--nob);color:var(--no)}
.btn.sm{height:36px;padding:0 13px;border-radius:11px;font-size:13.5px}
.btn.w{width:100%}
.btn[disabled]{opacity:.35}
.pill{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:7px;font-size:12px;font-weight:600;background:var(--soft);color:var(--ink2);margin:0 4px 4px 0;white-space:nowrap}
.pill.pri{background:var(--pri2);color:var(--pri)}.pill.ok{background:var(--okb);color:var(--ok)}.pill.no{background:var(--nob);color:var(--no)}.pill.warn{background:var(--warnb);color:var(--warn)}.pill.old{background:var(--oldb);color:var(--old)}
.li{display:flex;align-items:center;gap:12px;padding:14px 18px;cursor:pointer}
.li+.li{border-top:1px solid var(--line)}
.li:active{background:var(--soft)}
.li .t{font-weight:600}
.li .chev{color:#c4c7ce}
.ico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none;font-weight:800;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.stats div+div{border-left:1px solid var(--line)}
.stats b{display:block;font-size:24px;font-weight:800;letter-spacing:-.5px}
.stats span{font-size:12.5px;color:var(--mute)}
.meter{height:8px;border-radius:9px;background:var(--soft);overflow:hidden;margin-top:7px}
.meter i{display:block;height:100%;border-radius:9px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;height:34px;padding:0 14px;border-radius:99px;background:#fff;border:1px solid var(--line);font-size:13.5px;color:var(--ink2);white-space:nowrap}
.chips button.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
.seg{display:flex;background:#e9eaee;border-radius:13px;padding:3px;margin-bottom:14px}
.seg button{flex:1;height:38px;border-radius:10px;font-size:14px;color:var(--ink2)}
.seg button.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08)}
/* 문제 */
.qmeta{display:flex;flex-wrap:wrap;margin-bottom:6px}
.qtext{font-size:17px;font-weight:600;line-height:1.75;word-break:keep-all}
.qtext img{display:block;max-width:100%;margin:12px auto;mix-blend-mode:multiply}
.opt img,.ex img{max-width:100%;vertical-align:middle;mix-blend-mode:multiply}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:18px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;min-height:54px;padding:10px 14px;border:1.5px solid var(--line);border-radius:14px;background:#fff;font-size:15.5px;word-break:keep-all;transition:border-color .12s,background .12s}
.opt .n{flex:none;width:28px;height:28px;border-radius:9px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:13.5px;font-weight:800;color:var(--ink2)}
.opt:active{background:var(--soft)}
.opt.sel{border-color:var(--pri);background:var(--pri2)}.opt.sel .n{background:var(--pri);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--okb)}.opt.ok .n{background:var(--ok);color:#fff}
.opt.no{border-color:var(--no);background:var(--nob)}.opt.no .n{background:var(--no);color:#fff}
.result{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;margin-bottom:4px}
.result.ok{color:var(--ok)}.result.no{color:var(--no)}
.ex h4{margin:18px 0 8px;font-size:13px;color:var(--mute);font-weight:700;letter-spacing:.2px}
.ex .core{background:var(--pri2);border-radius:12px;padding:13px 15px;font-size:15px}
.ex ol{margin:0;padding:0;list-style:none;counter-reset:s}
.ex ol li{counter-increment:s;position:relative;padding:8px 0 8px 34px;font-size:15px;border-bottom:1px dashed var(--line)}
.ex ol li:last-child{border-bottom:0}
.ex ol li:before{content:counter(s);position:absolute;left:0;top:9px;width:22px;height:22px;border-radius:7px;background:var(--soft);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;color:var(--ink2)}
.ex .tip{background:var(--warnb);border-radius:12px;padding:13px 15px;font-size:14.5px}
.ex .none{background:var(--soft);border-radius:12px;padding:13px 15px;font-size:14.5px;color:var(--ink2)}
.links{margin-top:12px;font-size:13.5px;color:var(--mute);line-height:1.9}
.links a{color:var(--pri);cursor:pointer;font-weight:500}
.act{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.qfoot{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom));z-index:9;padding:10px 16px;background:linear-gradient(rgba(244,245,247,0),var(--bg) 35%)}
.qfoot .in{max-width:720px;margin:0 auto;display:flex;gap:8px}
.qfoot .btn{flex:1}
.qfoot .btn.line{flex:0 0 96px}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.grid button{aspect-ratio:1;border-radius:9px;background:var(--soft);font-size:12px;font-weight:700;color:var(--ink2)}
.grid button.done{background:var(--pri2);color:var(--pri)}
.grid button.ok{background:var(--okb);color:var(--ok)}.grid button.no{background:var(--nob);color:var(--no)}
.grid button.cur{box-shadow:inset 0 0 0 2px var(--ink)}
/* 오답노트 */
.note{padding:16px 18px;cursor:pointer}
.note+.note{border-top:1px solid var(--line)}
.note .pv{font-size:14.5px;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:4px 0}
.note .memo{font-size:13px;color:var(--warn);background:var(--warnb);border-radius:8px;padding:4px 8px;display:inline-block;margin-top:4px}
.ans{display:flex;gap:8px;margin:12px 0 0}
.ans div{flex:1;border-radius:12px;padding:10px 12px;font-size:13px}
.ans b{display:block;font-size:16px}
textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:12px;padding:12px;resize:vertical;background:var(--soft);outline:none}
textarea:focus{border-color:var(--pri);background:#fff}
/* 개념 */
.con{padding:0}
.con summary{list-style:none;padding:16px 18px;font-weight:700;display:flex;align-items:center;gap:10px;cursor:pointer}
.con summary::-webkit-details-marker{display:none}
.con summary:after{content:"";width:8px;height:8px;border-right:2px solid #b8bcc5;border-bottom:2px solid #b8bcc5;transform:rotate(45deg);margin-left:auto;transition:.2s}
.con[open] summary:after{transform:rotate(-135deg)}
.con .body{padding:0 18px 18px;font-size:15px}
.body table{border-collapse:collapse;width:100%;font-size:13.5px;margin:10px 0}
.body th,.body td{border:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
.body th{background:var(--soft);font-weight:700}
.body ul{padding-left:18px;margin:8px 0}.body li{margin:5px 0}
.body .f{background:var(--ink);color:#fff;border-radius:10px;padding:10px 12px;margin:10px 0;font-weight:700;text-align:center}
.body .tip{background:var(--warnb);border-radius:10px;padding:10px 12px}
.body .warn{background:var(--oldb);color:var(--old);border-radius:10px;padding:10px 12px;font-size:14px}
/* 시트·토스트 */
.sheet{position:fixed;inset:0;z-index:30;background:rgba(15,18,25,.4);display:flex;align-items:flex-end;justify-content:center;animation:fd .15s}
.sheet .in{background:#fff;width:100%;max-width:720px;max-height:86vh;overflow:auto;border-radius:22px 22px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));animation:up .2s}
.sheet .grab{width:40px;height:4px;border-radius:4px;background:#dcdfe5;margin:-10px auto 14px}
@keyframes up{from{transform:translateY(30px);opacity:.6}}@keyframes fd{from{opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom));transform:translate(-50%,10px);background:#16181d;color:#fff;padding:10px 18px;border-radius:12px;font-size:14px;z-index:40;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.empty{text-align:center;color:var(--mute);padding:56px 20px;font-size:14.5px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--pri);border-radius:50%;animation:sp .8s linear infinite;margin:60px auto}
@keyframes sp{to{transform:rotate(360deg)}}
/* ── 자격증·필기/실기 탭 (v3) ── */
.top{background:rgba(255,255,255,.94);border-bottom:1px solid var(--line);flex-wrap:wrap;padding-bottom:0}
.top .bar1{display:flex;align-items:center;gap:8px;width:100%;min-height:44px}
.brand{font-weight:800;font-size:18px;letter-spacing:-.5px;flex:1}
.brand small{font-size:12px;font-weight:600;color:var(--mute);margin-left:6px}
.ctabs{display:flex;gap:2px;width:100%;overflow-x:auto;scrollbar-width:none;margin-top:2px}
.ctabs::-webkit-scrollbar{display:none}
.ctabs button{flex:none;padding:9px 12px 11px;font-size:15px;font-weight:600;color:var(--mute);position:relative}
.ctabs button.on{color:var(--ink)}
.ctabs button.on:after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:3px;border-radius:3px;background:var(--ink)}
.mtabs{display:flex;gap:6px;width:100%;padding:8px 0 10px}
.mtabs button{height:32px;padding:0 16px;border-radius:99px;font-size:13.5px;font-weight:600;background:var(--soft);color:var(--ink2)}
.mtabs button.on{background:var(--pri);color:#fff}
.mtabs .hint{margin-left:auto;align-self:center;font-size:12px;color:var(--mute)}
.top.inner{padding-bottom:10px}
.ready{display:flex;flex-direction:column;align-items:center;text-align:center;padding:40px 18px}
.ready .big{width:64px;height:64px;border-radius:20px;background:var(--pri2);color:var(--pri);display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.ready h3{margin:0 0 6px;font-size:19px}
.ready p{margin:0;color:var(--mute);font-size:14.5px}
.steps-list{text-align:left;margin-top:18px;width:100%}
.steps-list li{margin:6px 0;font-size:14.5px}
.pill.cbt{background:#e6f6fb;color:#0b7285}

</style>
</head>
<body>
<header class="top" id="top"></header>
<main id="view"><div class="spin"></div></main>
<nav class="tabs">
  <button data-t="home"><i></i>홈</button>
  <button data-t="exam"><i></i>기출</button>
  <button data-t="var"><i></i>변형</button>
  <button data-t="con"><i></i>개념</button>
  <button data-t="note"><i></i>오답노트<span class="dot" id="notedot" style="display:none"></span></button>
</nav>
<div class="toast" id="toast"></div>
<script>
// 변형문제 생성기: 기출 유형을 그대로 두고 숫자만 바꿔 새 문제를 만든다.
(function () {
  const R = (a, b, st = 1) => { const n = Math.floor((b - a) / st); return +(a + st * Math.floor(Math.random() * (n + 1))).toFixed(6); };
  const P = a => a[Math.floor(Math.random() * a.length)];
  const f = (x, d = 3) => {
    if (!isFinite(x)) return String(x);
    const ax = Math.abs(x);
    if (ax !== 0 && (ax >= 1e5 || ax < 1e-3)) {
      const e = Math.floor(Math.log10(ax)); const m = x / Math.pow(10, e);
      return `${(+m.toFixed(2))}×10<sup>${e}</sup>`;
    }
    return String(+x.toFixed(d));
  };
  // 정답 + 오답(흔한 실수) → 4지선다
  function choices(ans, wrongs, d = 3) {
    const out = [f(ans, d)];
    const pool = wrongs.concat([ans * 2, ans / 2, ans * 1.5, ans * 0.75, ans * 3, ans / 3, ans * 1.2, ans * 0.8]);
    for (const w of pool) {
      if (out.length >= 4) break;
      const s = f(w, d);
      if (isFinite(w) && w !== 0 && !out.includes(s)) out.push(s);
    }
    const order = [0, 1, 2, 3].sort(() => Math.random() - 0.5);
    return { c: order.map(i => out[i]), a: order.indexOf(0) + 1 };
  }
  const deg = x => x * Math.PI / 180;
  const V = [];
  const add = (id, s, name, gen) => V.push({ id, s, name, gen });

  // ───── 1과목 전기자기학 ─────
  add('v_eta', 1, '고유 임피던스 η = 377√(μr/εr)', () => {
    const er = P([4, 9, 16, 25, 36, 49, 64, 81, 100]), mr = P([1, 1, 1, 4]);
    const ans = 377 * Math.sqrt(mr / er);
    const ch = choices(ans, [377 * mr / er, 377 * Math.sqrt(er / mr) / 10, 120 * Math.sqrt(mr / er)], 1);
    return { q: `ε<sub>r</sub> = ${er}, μ<sub>r</sub> = ${mr} 인 매질의 고유 임피던스는 약 몇 Ω 인가?`, ...ch,
      steps: [`공식: η = √(μ/ε) = 377 × √(μ<sub>r</sub>/ε<sub>r</sub>)`, `√(${mr}/${er}) = ${f(Math.sqrt(mr / er), 4)}`, `η = 377 × ${f(Math.sqrt(mr / er), 4)} ≈ <b>${f(ans, 1)} Ω</b>`],
      tip: '루트를 빼먹고 377×μr/εr로 계산한 값이 오답 보기로 자주 나와요.' };
  });
  add('v_pol', 1, '분극 전하량 Q(1 − 1/εr)', () => {
    const Q = P([0.1, 0.2, 0.5, 1, 2]), er = P([2, 4, 5, 8, 10, 20]);
    const ans = Q * (1 - 1 / er);
    const ch = choices(ans, [Q / er, Q * er, Q * (er - 1)], 4);
    return { q: `공기 평행판 커패시터에 ${Q} C의 전하를 충전한 뒤 전원을 분리하고, 두 판 사이에 비유전율 ${er}인 유전체를 채웠다. 유전체 표면에 나타나는 분극 전하량(C)은?`, ...ch,
      steps: ['전원을 분리했으므로 극판 전하 Q는 그대로', `분극 전하 = Q(1 − 1/ε<sub>r</sub>) = ${Q} × (1 − 1/${er})`, `= <b>${f(ans, 4)} C</b>`],
      tip: 'Q/εr(남는 유효 전하)와 헷갈리지 마세요. 분극전하는 "상쇄되는 양"이에요.' };
  });
  add('v_mutual', 1, '상호 인덕턴스 M = L₁·N₂/N₁', () => {
    const N1 = P([50, 100, 200, 300]), k = P([2, 3, 4, 5]), N2 = N1 * k, L1 = P([1, 2, 3, 4, 5]);
    const ans = L1 * k;
    const ch = choices(ans, [L1 * k * k, L1 / k, L1 * Math.sqrt(k)], 2);
    return { q: `단면적이 균일한 환상철심에 권수 ${N1}회인 A코일과 ${N2}회인 B코일이 있다. A코일의 자기 인덕턴스가 ${L1} H일 때 두 코일의 상호 인덕턴스(H)는? (단, 누설자속은 0)`, ...ch,
      steps: [`L ∝ N² → L<sub>B</sub> = ${L1} × (${N2}/${N1})² = ${L1 * k * k} H`, `M = √(L<sub>A</sub>L<sub>B</sub>) = √(${L1} × ${L1 * k * k}) = <b>${ans} H</b>`, `(지름길) M = L<sub>A</sub> × N<sub>B</sub>/N<sub>A</sub> = ${L1} × ${k}`],
      tip: 'L_B 값(권수비 제곱)을 그대로 답으로 고르는 실수가 많아요.' };
  });
  add('v_solenoid', 1, '환상 솔레노이드 권수 N = √(Ll/μS)', () => {
    const l = P([10, 20, 30]), S = P([1, 2, 4, 5]), mr = P([1000, 2000, 5000, 10000, 15000]);
    const N0 = P([10, 12, 15, 20, 25, 30, 40, 50]);
    const L = 4 * Math.PI * 1e-7 * mr * S * 1e-4 * N0 * N0 / (l / 100);
    const Lm = +(L * 1000).toPrecision(2);
    const ans = Math.sqrt(Lm / 1000 * (l / 100) / (4 * Math.PI * 1e-7 * mr * S * 1e-4));
    const ch = choices(ans, [ans * ans, ans * 10, ans / Math.sqrt(10)], 0);

function record(q, id, chosen, mode) {
  const ok = chosen === q.a;

  API.log({ id, s: q.s, c: chosen, a: q.a, ok, mode });

    if (n.arch) { n.arch = ''; moved = true; }

    const left = cfg.ids.length - Object.keys(sess).length;
    if (left && !force) return ask(`아직 ${left}문제를 안 풀었어요.<br>그래도 채점할까요?`, '채점하기', () => finish(true));
    view().innerHTML = '<div class="spin"></div>';
    const qa = {}, bys = {}; let ok = 0, toNote = 0;
    for (const x of cfg.ids) {
      const [qq] = await getQ(x); qa[x] = qq.a; const b = bys[qq.s] = bys[qq.s] || [0, 0]; b[0]++;
      if (sess[x]) { const r = record(qq, x, sess[x], 'test'); if (r.ok) { ok++; b[1]++; } else toNote++; }
    }
    const cf = { ...cfg, done: true, qa, i: 0 }; stack[stack.length - 1] = ['quiz', cf];
    document.querySelectorAll('.qfoot').forEach(e => e.remove());
    const score = Math.round(ok / cfg.ids.length * 100), full = cfg.ids.length === 100, pass = full && score >= 60 && Object.values(bys).every(([n, k]) => k / n >= .4);
    head(cfg.title + ' 결과');
    view().innerHTML = `<div class="card" style="text-align:center;padding:28px 18px"><div class="muted small">${cfg.ids.length}문제 중 ${ok}문제 정답</div><div style="font-size:48px;font-weight:800;letter-spacing:-2px;color:${score >= 60 ? 'var(--ok)' : 'var(--no)'}">${score}<span style="font-size:20px">점</span></div>
      ${full ? `<span class="pill ${pass ? 'ok' : 'no'}" style="height:28px;font-size:14px;padding:0 12px">${pass ? '합격권이에요' : '아직 불합격권'}</span>` : ''}</div>
      <div class="card">${Object.keys(bys).map(s => { const p = Math.round(bys[s][1] / bys[s][0] * 100); return `<div style="margin-bottom:12px"><div class="row small"><span class="grow" style="font-weight:600;font-size:14.5px">${SUBJ()[s - 1]}</span><b style="color:${p >= 40 ? 'var(--ink)' : 'var(--no)'}">${p}점${p < 40 ? ' (과락)' : ''}</b></div><div class="meter"><i style="width:${p}%;background:${p >= 60 ? 'var(--ok)' : p >= 40 ? '#f0a020' : 'var(--no)'}"></i></div></div>`; }).join('')}</div>
      ${toNote ? `<div class="card row"><span class="ico" style="background:var(--nob);color:var(--no)">${svg('note', 20)}</span><span class="grow">틀린 <b>${toNote}문제</b>를 오답노트에 담았어요.</span></div>` : ''}
      <button class="btn w" id="rv">해설 보며 다시 보기</button>`;
    updateDot();
    $('#rv').onclick = () => replace('quiz', cf);
  }
  if (!graded) view().querySelectorAll('.opt').forEach(b => b.onclick = () => {
    const k = +b.dataset.k; sess[id] = k;
    if (cfg.mode === 'learn') { const r = record(q, id, k, cfg.from === 'note' ? 'review' : 'learn'); if (!r.ok && r.moved) toast('오답노트에 담았어요'); updateDot(); }
    replace('quiz', { ...cfg, i });
  });
  bindExplain();
};

function explainHTML(q, ex, picked, id) {
  const ok = picked === q.a, n = ST.notes[id], w = EW();
  let h = `<div class="card ex"><div class="result ${picked ? (ok ? 'ok' : 'no') : ''}">${picked ? (ok ? '정답이에요' : `아쉬워요 · 정답은 ${q.a}번`) : `정답 ${q.a}번`}</div>`;
  if (n && !n.arch && ok && n.streak >= 2) h += `<div class="row" style="background:var(--okb);border-radius:12px;padding:10px 12px;margin-top:8px"><span class="grow small" style="color:var(--ok);font-weight:600">${n.streak}번 연속 정답! 이제 보관함으로 옮길까요?</span><button class="btn sm" style="background:var(--ok)" data-arch="${id}">보관</button></div>`;
  if (q.e) h += `<h4>핵심 개념</h4><div class="core">${q.e.core}</div><h4>풀이 과정</h4><ol>${q.e.steps.map(s => `<li>${s}</li>`).join('')}</ol><h4>비슷한 문제가 나오면</h4><div class="tip">${q.e.tip}</div>`;
  else h += `<h4>해설</h4><div class="none">이 문제의 상세 해설은 준비 중이에요. 아래 개념 카드와 같은 유형 기출의 해설을 먼저 참고하세요.</div>`;
  const c = q.k && w.concepts.find(x => x.id === q.k), hasV = q.v && VARIANTS.find(v => v.id === q.v);
  if (c || hasV) h += `<div class="act">${c ? `<button class="btn sm sub" data-con="${c.id}">개념 · ${c.t}</button>` : ''}${hasV ? `<button class="btn sm" data-var="${q.v}">숫자 바꿔 연습</button>` : ''}</div>`;
  if (q.v && w.vsrc[q.v]) { const sib = w.vsrc[q.v].filter(x => x !== id).sort().reverse(); if (sib.length) h += `<div class="links">같은 유형 기출 · ${sib.slice(0, 6).map(x => `<a data-open="${x}">${qlabel(x)}</a>`).join(', ')}${sib.length > 6 ? ` 외 ${sib.length - 6}` : ''}</div>`; }
  return h + '</div>';
}
function bindExplain() {
  view().querySelectorAll('[data-con]').forEach(b => b.onclick = () => conceptSheet(b.dataset.con));
  view().querySelectorAll('[data-var]').forEach(b => b.onclick = () => go('vplay', b.dataset.var));
  view().querySelectorAll('[data-open]').forEach(b => b.onclick = () => go('quiz', { ids: [b.dataset.open], mode: 'learn', title: '기출', i: 0, sess: {} }));
  view().querySelectorAll('[data-arch]').forEach(b => b.onclick = () => { archive(b.dataset.arch, true); b.closest('.row').remove(); });
}
function conceptSheet(id) { const c = EW().concepts.find(x => x.id === id); sheet(`<div class="row" style="margin-bottom:6px"><div class="grow" style="font-weight:800;font-size:18px">${c.t}</div><button class="btn sm line" data-close>닫기</button></div><div class="body">${c.h}</div>`); }
function archive(id, on) { const n = ST.notes[id]; if (!n) return; n.arch = on ? today() : ''; if (!on) n.streak = 0; API.note(n); updateDot(); toast(on ? '보관함으로 옮겼어요' : '복습 목록으로 되돌렸어요'); }

// ───────── 오답노트 ─────────
let noteTab = 'review', noteSub = 0, noteSort = 'recent';
V.note = async () => {
  tab('note'); rootHead('오답노트');
  const all = noteTab === 'review' ? reviewList() : archList();
  let list = all.filter(n => !noteSub || n.s === noteSub);
  const key = n => noteTab === 'review' ? (n.lastRev || '') : (n.arch || '');
  list.sort(noteSort === 'many' ? (a, b) => b.wrong - a.wrong || (key(b) > key(a) ? 1 : -1) : (a, b) => (key(b) > key(a) ? 1 : key(b) < key(a) ? -1 : 0));
  let h = `<div class="seg" style="margin-top:14px"><button data-nt="review" class="${noteTab === 'review' ? 'on' : ''}">복습할 문제 ${reviewList().length}</button><button data-nt="arch" class="${noteTab === 'arch' ? 'on' : ''}">보관함 ${archList().length}</button></div>
  <div class="chips">${[0, ...SUBJ().map((_, k) => k + 1)].map(s => `<button data-sb="${s}" class="${noteSub === s ? 'on' : ''}">${s ? SUBJ()[s - 1] : '전체'} ${all.filter(n => !s || n.s === s).length}</button>`).join('')}</div>`;
  if (!list.length) {
    view().innerHTML = h + `<div class="empty"><b>${noteTab === 'review' ? '복습할 오답이 없어요' : '보관함이 비어 있어요'}</b>${noteTab === 'review' ? '기출을 풀다 틀린 문제가 자동으로 여기에 모여요.' : '복습하다 확실히 알게 된 문제를 보관함으로 옮겨 두세요.'}</div>`;
  } else {
    h += noteTab === 'review' ? `<button class="btn w" id="redo" style="margin-bottom:12px">${list.length}문제 다시 풀기</button>` : '';
    h += `<div class="row small muted" style="margin:2px 4px 8px"><span class="grow">${list.length}문제</span><button data-sort="recent" style="font-weight:${noteSort === 'recent' ? 700 : 400};color:${noteSort === 'recent' ? 'var(--ink)' : ''}">최근순</button>·<button data-sort="many" style="font-weight:${noteSort === 'many' ? 700 : 400};color:${noteSort === 'many' ? 'var(--ink)' : ''}">많이 틀린 순</button></div>`;
    h += `<div class="card tight" id="nl"><div class="spin"></div></div>`;
    view().innerHTML = h;
    const shown = list.slice(0, 80);
    for (const n of shown) await API.exam(n.id.split('-')[0]);
    $('#nl').innerHTML = shown.map(n => {
      const [d, k] = n.id.split('-'), q = EX[d].m[+k];
      return `<div class="note" data-id="${n.id}"><div class="qmeta" style="margin:0"><span class="pill">${qlabel(n.id)}</span>${subjPill(n.s)}${noteTab === 'review' ? `<span class="pill no">${n.wrong}회 틀림</span>${n.streak ? `<span class="pill ok">연속 ${n.streak}회 정답</span>` : ''}` : `<span class="pill ok">${n.arch} 보관</span>`}</div>
      <div class="pv">${q ? strip(q.q) : ''}</div>${n.memo ? `<div class="memo">메모 · ${n.memo.replace(/</g, '&lt;').slice(0, 40)}</div>` : ''}</div>`; }).join('') + (list.length > 80 ? '<div class="li small muted">최근 80문제만 보여요</div>' : '');
    view().querySelectorAll('.note').forEach(e => e.onclick = () => go('notedetail', e.dataset.id));
    if ($('#redo')) $('#redo').onclick = () => go('quiz', { ids: list.map(n => n.id), mode: 'learn', title: '오답 복습', i: 0, sess: {}, from: 'note' });
  }
  view().querySelectorAll('[data-nt]').forEach(b => b.onclick = () => { noteTab = b.dataset.nt; V.note(); });
  view().querySelectorAll('[data-sb]').forEach(b => b.onclick = () => { noteSub = +b.dataset.sb; V.note(); });
  view().querySelectorAll('[data-sort]').forEach(b => b.onclick = () => { noteSort = b.dataset.sort; V.note(); });
};
V.notedetail = async id => {
  tab('note'); head(qlabel(id));
  view().innerHTML = '<div class="spin"></div>';
  const [q, ex] = await getQ(id), n = ST.notes[id];
  if (!n) return back();
  view().innerHTML = `<div class="card"><div class="qmeta">${subjPill(q.s)}<span class="pill no">${n.wrong}회 틀림</span><span class="pill">처음 틀린 날 ${n.first}</span>${q.old ? '<span class="pill old">구 기준</span>' : ''}</div>
    <div class="qtext">${render(q.q, ex)}</div><div class="opts">${q.c.map((c, k) => `<div class="opt ${k + 1 === q.a ? 'ok' : k + 1 === n.last ? 'no' : ''}"><span class="n">${k + 1}</span><span>${render(c, ex)}</span></div>`).join('')}</div>
    <div class="ans"><div style="background:var(--nob);color:var(--no)">내가 고른 답<b>${n.last}번</b></div><div style="background:var(--okb);color:var(--ok)">정답<b>${q.a}번</b></div><div style="background:var(--soft);color:var(--ink2)">복습<b>${n.rev}회</b></div></div></div>
  <div class="card"><div style="font-weight:700;margin-bottom:8px">나만의 메모</div><textarea id="memo" placeholder="왜 틀렸는지, 헷갈린 공식, 다음에 볼 포인트를 적어 두세요">${(n.memo || '').replace(/</g, '&lt;')}</textarea><button class="btn sm" id="sv" style="margin-top:10px">메모 저장</button></div>
  ${explainHTML(q, ex, null, id)}
  <div class="row" style="gap:8px"><button class="btn grow" id="redo">다시 풀기</button>${n.arch ? '<button class="btn grow sub" id="ar0">복습 목록으로</button>' : '<button class="btn grow sub" id="ar1">보관함으로</button>'}</div>
  <button class="btn w line" id="del" style="margin-top:8px;color:var(--no)">오답노트에서 삭제</button>`;
  $('#sv').onclick = () => { n.memo = $('#memo').value.trim(); API.note(n); toast('메모를 저장했어요'); };
  $('#redo').onclick = () => go('quiz', { ids: [id], mode: 'learn', title: '오답 다시', i: 0, sess: {}, from: 'note' });
  if ($('#ar1')) $('#ar1').onclick = () => { archive(id, true); back(); };
  if ($('#ar0')) $('#ar0').onclick = () => { archive(id, false); back(); };
  $('#del').onclick = () => ask('이 문제를 오답노트에서 지울까요?<br><span class="small muted">풀이 기록은 남아요.</span>', '삭제', () => { delete ST.notes[id]; API.delNote(id); updateDot(); toast('삭제했어요'); back(); }, true);
  bindExplain();
};
V.starlist = () => {
  head('즐겨찾기'); const s = Object.keys(ST.star).filter(inMode).sort().reverse();
  if (!s.length) { view().innerHTML = '<div class="empty"><b>즐겨찾기가 비어 있어요</b>문제 화면 오른쪽 위 별을 누르면 여기에 모여요.</div>'; return; }
  view().innerHTML = `<button class="btn w" id="all" style="margin:14px 0 12px">${s.length}문제 풀기</button><div class="card tight">${s.map(i => `<div class="li" data-id="${i}"><span class="grow t">${qlabel(i)}</span>${subjPill(subjOf(i))}<span class="chev">${svg('chev', 18)}</span></div>`).join('')}</div>`;
  $('#all').onclick = () => go('quiz', { ids: s, mode: 'learn', title: '즐겨찾기', i: 0, sess: {} });
  view().querySelectorAll('[data-id]').forEach(e => e.onclick = () => go('quiz', { ids: [e.dataset.id], mode: 'learn', title: '즐겨찾기', i: 0, sess: {} }));
};

// ───────── 변형문제 ─────────
V.var = () => {
  tab('var'); rootHead('변형문제');
  const w = W();
  view().innerHTML = `<div class="hero" style="padding-top:14px"><p>기출과 <b style="color:var(--ink)">같은 풀이법</b>에 숫자만 새로 뽑은 문제예요. 누를 때마다 새 숫자가 나오고, 어느 기출을 바꾼 건지 함께 알려 줘요. 5과목(KEC)은 규정 숫자가 곧 정답이라 개념 탭의 표로 정리했어요.</p></div>` +
    [1, 2, 3, 4].map(s => `<div class="sec"><h3>${w.subjects[s - 1]}</h3><span class="more">${VARIANTS.filter(v => v.s === s).length}유형</span></div><div class="card tight">${VARIANTS.filter(v => v.s === s).map(v => `<div class="li" data-v="${v.id}"><span class="grow"><span class="t">${v.name}</span><br><span class="small muted">원본 기출 ${(w.vsrc[v.id] || []).length}문제</span></span><span class="chev">${svg('chev', 18)}</span></div>`).join('')}</div>`).join('');
  view().querySelectorAll('[data-v]').forEach(e => e.onclick = () => go('vplay', e.dataset.v));
};
V.vplay = vid => {
  tab('var');
  const v = VARIANTS.find(x => x.id === vid), p = v.gen(), src = (EW().vsrc[vid] || []).slice().sort().reverse(); let picked = null;
  head('변형 · ' + EW().subjects[v.s - 1]);
  const draw = () => {
    let h = `<div class="card"><div class="qmeta"><span class="pill warn">변형문제</span><span class="pill">${v.name}</span></div>
    ${src.length ? `<div class="links" style="margin:0 0 10px">원본 기출 · ${src.slice(0, 3).map(x => `<a data-open="${x}">${qlabel(x)}</a>`).join(', ')}${src.length > 3 ? ` 외 ${src.length - 3}문제` : ''}</div>` : ''}
    <div class="qtext">${p.q}</div><div class="opts">${p.c.map((c, k) => { let cls = ''; if (picked) { if (k + 1 === p.a) cls = 'ok'; else if (picked === k + 1) cls = 'no'; } return `<button class="opt ${cls}" data-k="${k + 1}"><span class="n">${k + 1}</span><span>${c}</span></button>`; }).join('')}</div></div>`;
    if (picked) h += `<div class="card ex"><div class="result ${picked === p.a ? 'ok' : 'no'}">${picked === p.a ? '정답이에요' : '아쉬워요 · 정답은 ' + p.a + '번'}</div><h4>풀이 과정</h4><ol>${p.steps.map(s => `<li>${s}</li>`).join('')}</ol><h4>함정 주의</h4><div class="tip">${p.tip}</div>
    ${src.length ? `<div class="links">이 유형의 기출 전체 · ${src.map(x => `<a data-open="${x}">${qlabel(x)}</a>`).join(', ')}</div>` : ''}</div>`;
    view().innerHTML = h + '<div style="height:76px"></div>';
    document.querySelectorAll('.qfoot').forEach(e => e.remove());
    const foot = document.createElement('div'); foot.className = 'qfoot';
    foot.innerHTML = `<div class="in"><button class="btn" id="again">새 숫자로 다시 풀기</button></div>`; document.body.appendChild(foot);
    $('#again').onclick = () => replace('vplay', vid);
    view().querySelectorAll('.opt').forEach(b => b.onclick = () => { if (!picked) { picked = +b.dataset.k; draw(); } });
    bindExplain();
  };
  draw();
};

// ───────── 개념 ─────────
let conS = 1;
V.con = () => {
  tab('con'); rootHead('개념정리');
  const w = W();
  view().innerHTML = `<div class="chips" style="margin-top:14px">${w.subjects.map((nm, k) => `<button data-s="${k + 1}" class="${k + 1 === conS ? 'on' : ''}">${nm}</button>`).join('')}</div>` +
    w.concepts.filter(c => c.s === conS).map(c => `<details class="card con"><summary>${c.t}</summary><div class="body">${c.h}</div></details>`).join('');
  view().querySelectorAll('[data-s]').forEach(b => b.onclick = () => { conS = +b.dataset.s; V.con(); });
};

// ───────── 시작 ─────────
function connectScreen(err) {
  $('.tabs').style.display = 'none';
  $('#top').className = 'top inner'; $('#top').innerHTML = '<div class="bar1"><div class="brand">기사 합격노트</div></div>';
  view().innerHTML = `<div class="ready" style="padding-top:28px"><div class="big">${svg('bolt', 30)}</div><h3>구글 시트와 연결하기</h3>
  <p>처음 한 번만 입력하면 이 기기에 기억돼요.${err ? `<br><span style="color:var(--no)">${err}</span>` : ''}</p>
  <div class="card" style="width:100%;text-align:left;margin-top:16px">
   <div class="small muted" style="margin-bottom:6px">앱스크립트 웹 앱 주소 (…/exec)</div><textarea id="cu" style="min-height:70px" placeholder="https://script.google.com/macros/s/…/exec">${REMOTE && REMOTE.url || ''}</textarea>
   <div class="small muted" style="margin:12px 0 6px">비밀 키 (앱스크립트 setup 실행 로그에 나온 값)</div><textarea id="ck" style="min-height:46px" placeholder="예: k8f2…">${REMOTE && REMOTE.key || ''}</textarea>
   <button class="btn w" id="cs" style="margin-top:14px">연결하기</button></div></div>`;
  $('#cs').onclick = () => {
    const url = $('#cu').value.trim(), key = $('#ck').value.trim();
    if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(url)) return toast('주소는 …/exec 로 끝나야 해요');
    if (!key) return toast('비밀 키를 입력해 주세요');
    try { localStorage.setItem('eg3_remote', JSON.stringify({ url, key })); } catch (e) {}
    location.reload();
  };
}
function boot() {
  document.querySelectorAll('.tabs button').forEach(b => { b.querySelector('i').outerHTML = svg(b.dataset.t, 23); b.onclick = () => { stack = [[b.dataset.t]]; show(b.dataset.t); }; });
  API.init().then(() => { if (!IDX.certs.some(c => c.id === CUR.cert)) CUR = { cert: 'elec', mode: 'written' }; stack = [['home']]; show('home'); })
    .catch(e => {
      if (IS_GAS) view().innerHTML = `<div class="empty"><b>데이터를 불러오지 못했어요</b>앱스크립트에서 checkSetup을 실행해 원인을 확인해 주세요.<br><span class="small">${e && e.message || e}</span></div>`;
      else connectScreen(IS_REMOTE ? '연결에 실패했어요: ' + (e && e.message || e) : '');
    });
}
boot();

</script>
